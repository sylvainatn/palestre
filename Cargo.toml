[package]
name = "palestre"
version = "0.1.0"
edition = "2021"
rust-version = "1.88" # slice::as_chunks (chargeur)
description = "Palestre — machine à agents déterministe (bytecode PBC v1, exécuteur distant annexe K)"
publish = false

# Dépendances : uniquement celles autorisées par README.md §3.
# Toute autre crate doit être validée par l'enseignant avant d'apparaître ici.
[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"

# Invariant 5 (README §1) : jamais d'`unsafe`, sur tout le paquet, tests compris.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
